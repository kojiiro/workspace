name: Generate lockfile for prototype
on:
  push:
    branches: [feat/headquarters-prototype-01]
    paths:
      - .github/workflows/generate-lockfile.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit reproducible lockfile
        run: |
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: add reproducible npm lockfile'
          git push origin HEAD:feat/headquarters-prototype-01
